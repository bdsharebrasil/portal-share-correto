    <!-- Manifest condicional -->
    <script>
      const isGithubDev =
        location.hostname.includes('github.dev') ||
        location.hostname.includes('app.github.dev');

      if (!isGithubDev) {
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = '/manifest.json';
        document.head.appendChild(link);
      } else {
        console.log('Manifest PWA desativado no ambiente GitHub Dev');
      }
    </script>

    <link rel="shortcut icon" href="/favicon.ico" />

  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>

  <body>
    <div id="root"></div>
    <script>
      // Configure Vite HMR to work with proxies by using the same host as the browser
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.hostname;
      const port = window.location.port ? parseInt(window.location.port) : (protocol === 'wss:' ? 443 : 80);

      window.__vite_hmr__ = {
        protocol,
        host,
        port
      };
    </script>
  </body>
